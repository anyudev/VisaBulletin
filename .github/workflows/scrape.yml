name: Scrape Visa Bulletin

on:
  # NOTE: The scheduled cron has been removed. travel.state.gov is now behind
  # Cloudflare bot protection, which blocks automated scraping from GitHub's
  # datacenter IPs (returns 403 / interactive challenge). Scheduled runs here
  # only failed and sent alert emails. Bulletins are now scraped locally with a
  # real browser — run `npm run scrape:local` on your own machine, then commit.
  # This workflow is kept for manual (workflow_dispatch) runs only; note those
  # will also fail against Cloudflare unless run from a trusted browser session.
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "scrape"
        type: choice
        options:
          - scrape
          - backfill

permissions:
  contents: write  # 需要 push 权限

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape latest bulletin
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'scrape')
        run: npm run scrape

      - name: Backfill historical data
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill'
        run: npm run backfill
        timeout-minutes: 30

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update visa bulletin data $(date -u +%Y-%m-%d)"
          git push
